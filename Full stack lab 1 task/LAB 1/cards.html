<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Cards Section -->
    <main class="container my-5">
        <div class="row g-4">
            <!-- Eagle Card -->
            <div class="col-4 col-md-6 col-lg-12">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-header bg-white border-0 pt-2 pb-3">
                        <h4 class="card-title fw-bold mb-0">Eagle</h4>
                    </div>
                    <img src="Images/Eagle.jpg" class="card-img-top img-fluid w-50 mx-auto rounded" alt="Eagle" style="max-height: 200px; object-fit: contain;">
                    <div class="card-body">
                        <p class="card-text text-muted mb-0">Keep Unmatched vision like the Eagle</p>
                    </div>
                </div>
            </div>

            <!-- Markhor Card -->
            <div class="col-4 col-md-6 col-lg-12">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-header bg-white border-0 pt-2 pb-3">
                        <h4 class="card-title fw-bold mb-0">Markhor</h4>
                    </div>
                    <img src="Images/Markhor.jpg" class="card-img-top img-fluid w-50 mx-auto rounded" alt="Markhor" style="max-height: 200px; object-fit: contain;">
                    <div class="card-body">
                        <p class="card-text text-muted mb-0">Keep Incredible resilience like Markhor</p>
                    </div>
                </div>
            </div>

            <!-- Wolf Card -->
            <div class="col-4 col-md-6 col-lg-12">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-header bg-white border-0 pt-2 pb-3">
                        <h4 class="card-title fw-bold mb-0">Wolf</h4>
                    </div>
                    <img src="Images/Wolf.jpg" class="card-img-top img-fluid w-50 mx-auto rounded" alt="Wolf" style="max-height: 200px; object-fit: contain;">
                    <div class="card-body">
                        <p class="card-text text-muted mb-0">Keep incredible loyalty like the Wolf</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
