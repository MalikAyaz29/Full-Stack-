<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App - Lab 3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center py-5">

  <div class="container" style="max-width: 520px;">
    <div class="card todo-card border-0 rounded-4 overflow-hidden">
      <div class="card-header card-header-gradient text-white p-4 text-center border-0">
        <h1 class="h3 mb-1 fw-bold"><i class="bi bi-check2-square me-2"></i>My To-Do List</h1>
        <p class="small mb-0 opacity-75">Lab 3 - Interactive DOM Manipulation</p>
      </div>

      <div class="card-body p-4">
        <div class="input-group mb-1">
          <input type="text" id="taskInput" class="form-control form-control-lg fs-6 rounded-start-3" placeholder="Add a new task...">
          <button id="addBtn" class="btn btn-primary px-4 fw-semibold rounded-end-3"><i class="bi bi-plus-lg me-1"></i>Add</button>
        </div>

        <p class="error-message text-danger small mb-3" id="errorMessage" style="min-height: 22px;"></p>

        <ul id="taskList" class="list-group list-group-flush mb-3"></ul>

        <div class="footer-row d-flex justify-content-between align-items-center pt-3 border-top">
          <button id="clearCompletedBtn" class="btn btn-outline-secondary btn-sm rounded-pill px-3 clear-btn">
            <i class="bi bi-trash3 me-1"></i>Clear Completed
          </button>
          <span class="task-count text-muted small fw-medium badge bg-light text-dark border py-2 px-3 rounded-pill" id="taskCount">No tasks yet.</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
